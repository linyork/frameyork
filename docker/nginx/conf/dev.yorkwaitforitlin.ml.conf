server {
    listen       80;
    server_name  dev.yorkwaitforitlin.ml;
    fastcgi_hide_header X-Powered-By;
    server_tokens off;

    charset utf-8;
    root  /var/www/html/Site/dev.yorkwaitforitlin.ml;
    index index.php index.html index.htm;

    # 返回所有常見的請求資訊
    location /echo {
        add_header Content-Type text/plain;
        return 200 "Request-Line: $request\nRequest-Method: $request_method\nRequest-URI: $request_uri\nQuery-String: $query_string\nIs-Args: $is_args\nURI: $uri\nDocument-URI: $document_uri\nDocument-Root: $document_root\nRealpath-Root: $realpath_root\nScheme: $scheme\nRequest-Body: $request_body\nRequest-Length: $request_length\nRequest-Time: $request_time\nStatus: $status\nBody-Bytes-Sent: $body_bytes_sent\nBytes-Sent: $bytes_sent\nConnection: $connection\nConnection-Requests: $connection_requests\nRemote-Address: $remote_addr\nRemote-Port: $remote_port\nRemote-User: $remote_user\nServer-Address: $server_addr\nServer-Name: $server_name\nServer-Port: $server_port\nServer-Protocol: $server_protocol\nHost: $host\nHTTP Host: $http_host\nUser-Agent: $http_user_agent\nReferer: $http_referer\nCookie: $http_cookie\nX-Forwarded-For: $http_x_forwarded_for\nHTTPS: $https\nContent-Type: $content_type\nContent-Length: $content_length\nLimit-Rate: $limit_rate\nNginx-Version: $nginx_version\nPID: $pid\nTime-Local: $time_local\nTime-ISO8601: $time_iso8601\nMsec: $msec\nUpstream-Address: $upstream_addr\nUpstream-Status: $upstream_status\nUpstream-Response Time: $upstream_response_time\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /note/favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_log  /var/log/nginx/dev.yorkwaitforitlin.ml.error.log;
    error_page 404 /View/404.html;

    client_max_body_size 100M;

    location ~* /(Application|Config|Template|View) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.css {
        add_header Content-Type text/css;
    }

    location ~ \.js {
        add_header Content-Type application/x-javascript;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass   php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param  NGINX_SERVER_ENV 'prod';
        include        fastcgi_params;
    }
}
